<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vibe Voice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div id="app">
    <div id="titlebar" data-tauri-drag-region>
      <div id="app-name">
        <span id="tb-dot"></span>
        <span>Vibe Voice</span>
      </div>
      <div id="titlebar-actions">
        <button id="settings-btn" title="Settings" class="tb-btn">
          <i data-lucide="settings"></i>
        </button>
        <button id="close-btn" title="Close" class="tb-btn">
          <i data-lucide="x"></i>
        </button>
      </div>
    </div>

    <div id="content">
      <div id="mic-wrap">
        <button id="mic-btn" title="Hold to record">
          <i data-lucide="mic" id="mic-icon"></i>
        </button>
        <div id="waveform">
          <span class="wave"></span>
          <span class="wave"></span>
          <span class="wave"></span>
          <span class="wave"></span>
          <span class="wave"></span>
        </div>
      </div>

      <div id="info">
        <div id="status-row">
          <span id="status-icons">
            <i data-lucide="mic" class="si si-idle"></i>
            <i data-lucide="radio" class="si si-recording"></i>
            <i data-lucide="circle-dashed" class="si si-thinking"></i>
            <i data-lucide="check-circle" class="si si-done"></i>
            <i data-lucide="clipboard" class="si si-copied"></i>
            <i data-lucide="alert-circle" class="si si-error"></i>
          </span>
          <p id="status">Hold to record</p>
        </div>
        <p id="hint">Ctrl+Space · drag to move</p>
        <p id="transcript"></p>
      </div>
    </div>

    <div id="settings-panel">
      <label for="api-key-input">Groq API Key</label>
      <div id="api-key-wrap">
        <i data-lucide="key-round" class="input-icon"></i>
        <input id="api-key-input" type="password" placeholder="gsk_..." autocomplete="off" />
      </div>

      <div class="setting-row">
        <label for="auto-type-toggle">Auto-Type Transcript</label>
        <label class="switch">
          <input id="auto-type-toggle" type="checkbox" />
          <span class="switch-slider"></span>
        </label>
      </div>

      <div class="setting-group" id="speed-setting-group">
        <div class="setting-row">
          <label for="speed-slider">Typing Keystroke Delay</label>
          <span id="speed-value">6 ms</span>
        </div>
        <div class="slider-wrap">
          <input id="speed-slider" type="range" min="1" max="50" value="6" class="range-slider" />
        </div>
      </div>

      <div id="settings-actions">
        <button id="settings-save-btn">Save</button>
        <button id="settings-cancel-btn">Cancel</button>
      </div>
      <p id="settings-status"></p>
    </div>
  </div>

  <script defer src="main.js"></script>
</body>
</html>
