<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vibe Voice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div id="titlebar" data-tauri-drag-region>
      <div id="app-name">
        <img src="logo.png" id="app-logo" alt="Logo" />
        <span>Vibe Voice</span>
      </div>
      <div id="titlebar-actions">
        <button id="history-btn" title="History" class="tb-btn">[h]</button>
        <button id="settings-btn" title="Settings" class="tb-btn">[~]</button>
        <button id="close-btn" title="Close" class="tb-btn">[x]</button>
      </div>
    </div>

    <div id="content">
      <div id="mic-wrap">
        <button id="mic-btn" title="Hold to record">
          <span id="mic-text">PTT</span>
        </button>
        <div id="waveform">
          <span class="wave"></span>
          <span class="wave"></span>
          <span class="wave"></span>
          <span class="wave"></span>
          <span class="wave"></span>
        </div>
      </div>

      <div id="info">
        <div id="status-row">
          <span id="status-icons">
            <span class="si si-idle">[-]</span>
            <span class="si si-recording">[●]</span>
            <span class="si si-thinking">[~]</span>
            <span class="si si-done">[✓]</span>
            <span class="si si-copied">[+]</span>
            <span class="si si-error">[!]</span>
          </span>
          <p id="status">Hold to record</p>
        </div>
        <p id="hint">Ctrl+Space · drag to move</p>
        <p id="transcript"></p>
      </div>
    </div>

    <div id="history-panel">
      <div id="history-header">
        <span>[ History ]</span>
        <button id="history-clear-btn">[clear]</button>
      </div>
      <div id="history-list"></div>
    </div>

    <div id="settings-panel">
      <div class="setting-label-row">
        <label for="api-key-input">Groq API Key</label>
        <span class="settings-link-btn" id="get-key-btn">Get free key ↗</span>
      </div>
      <div id="api-key-wrap">
        <input id="api-key-input" type="password" placeholder="gsk_..." autocomplete="off" />
      </div>

      <div class="setting-row">
        <label for="auto-type-toggle">Auto-Type Transcript</label>
        <label class="switch">
          <input id="auto-type-toggle" type="checkbox" />
          <span class="switch-slider"></span>
        </label>
      </div>

      <div class="setting-row">
        <label for="hotkey-mod-select">PTT Modifier</label>
        <select id="hotkey-mod-select" class="setting-select">
          <option value="Ctrl">Ctrl</option>
          <option value="Alt">Alt</option>
          <option value="Shift">Shift</option>
          <option value="None">None</option>
        </select>
      </div>

      <div class="setting-row">
        <label for="hotkey-trigger-select">PTT Key</label>
        <select id="hotkey-trigger-select" class="setting-select">
          <option value="Space">Space</option>
          <option value="CapsLock">CapsLock</option>
          <option value="Insert">Insert</option>
          <option value="F9">F9</option>
          <option value="F10">F10</option>
          <option value="F12">F12</option>
        </select>
      </div>

      <div class="setting-group" id="speed-setting-group">
        <div class="setting-row">
          <label for="speed-slider">Typing Keystroke Delay</label>
          <span id="speed-value">6 ms</span>
        </div>
        <div class="slider-wrap">
          <input id="speed-slider" type="range" min="1" max="50" value="6" class="range-slider" />
        </div>
      </div>

      <div class="setting-row">
        <label for="gui-scale-select">Interface Scale</label>
        <select id="gui-scale-select" class="setting-select">
          <option value="0.8">80%</option>
          <option value="0.9">90%</option>
          <option value="1" selected>100%</option>
          <option value="1.1">110%</option>
          <option value="1.25">125%</option>
          <option value="1.5">150%</option>
        </select>
      </div>

      <div id="settings-actions">
        <button id="settings-save-btn">Save</button>
        <button id="settings-cancel-btn">Cancel</button>
      </div>
      <p id="settings-status"></p>
    </div>
  </div>

  <script defer src="main.js"></script>
</body>
</html>
